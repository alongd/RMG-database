  method: terminal-segment
  statement: The parity-allowed delta-J=-1 3p5 4f -> 3p5 4s transition has delta-l=3 and obtains E1 amplitude through
    configuration mixing. Weakness is not a zero. gf1800.com lists GFLO=-7.5, but also EGFLO/EBOLT settings; observed
