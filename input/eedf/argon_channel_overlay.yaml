# Hand-written overlay for argon_channel_map.yaml (I-341): the class and the RMG reaction of each collision
# LoKI-B reads from ar-v1, keyed by the label LoKI-B prints. This is the only hand-maintained part of the map;
# everything else is derived by scripts/gen_eedf_channel_map.py. Classes follow owner ruling 2026-10-02
# section 6 and ruling C3; the policy each class and reaction must satisfy is POLICY in that script. Only
# class A carries a reaction: Ar(1s_i) + hv is the radiative-cascade placeholder, and a 4s level missing from
# PlasmaArgon is named Ar(<Paschen name>). Under 'species', each species the reactions name, the electron
# included, is given the RMG dictionary record it stands for; the record PlasmaArgon's dictionary holds under
# that label must be the same species by RMG's own comparison (structure, electrons, multiplicity and every
# state field RMG keeps). Ar(1s2) and Ar(1s4) are not in PlasmaArgon: their records say what an entry for
# them must be (one neutral argon atom with its level's LS-term multiplicity).
species:
  Ar: |
    1 Ar u0 p4 c0
  Ars: |
    multiplicity 3
    1 Ar u2 p3 c0
  Arp: |
    1 Ar u1 p3 c+1
  e-: |
    1 e u1 p0 c-1
  Ar(1s2): |
    multiplicity 1
    1 Ar u0 p4 c0
  Ar(1s4): |
    multiplicity 3
    1 Ar u2 p3 c0
collisions:
  'e + Ar(1S0) -> e + Ar(1S0), Elastic': {class: B}
