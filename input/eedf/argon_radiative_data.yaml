    CALCULATED_LIST_OMISSION_BOUND:
      transition_id: 018001.000058->018001.000002
      method: terminal-segment
      statement: The parity-allowed delta-J=-1 3p5 4f -> 3p5 4s transition has delta-l=3 and obtains E1
        amplitude through configuration mixing. Weakness is not a zero. gf1800.com lists GFLO=-7.5, but
        also EGFLO/EBOLT settings; observed rows below that floor occur, so no applicable omission upper
        bound is established. Retain status unbounded-omitted, A in [0,infinity], nominal A=0. The exact
        terminal segment joins the known-edge vector to unit 1s5.
      source_url: https://kurucz.cfa.harvard.edu/atoms/1800/gf1800.com
    RESONANCE_RADIATION_TRAPPED:
      statement: 'Optically thick reabsorption of ground resonance photons: nominal g=0. Only ground-return
        E1 lines are trapped. Bound escaped branching by g*A0/(g*A0+sum A_other), with g the larger Holstein
        Doppler and resonance estimates. This closed-form convention is not an engine transport model.
        Use NIST A where available, otherwise the explicitly tagged K11 fill. A-accuracy propagation is
        reported separately from the escape estimate evaluated at the sourced nominal A values.'
