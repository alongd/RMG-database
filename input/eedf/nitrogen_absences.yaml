schema: nitrogen-fate-absences/1
absences:
- id: N2-A-N2-quenching
  process: N2(A)+N2(X) quenching
  reason: No verified state-specific rate in local Guerra Table 5 or checked LoKI-GM
    rate entry.
  blocks: Quantitative N2(A) loss and closed heavy-particle energy budget.
- id: N2-C-N2-quenching
  process: N2(C)+N2(X) quenching
  reason: No verified state-specific rate in local Guerra Table 5 or checked LoKI-GM
    rate entry.
  blocks: Quantitative N2(C) collisional loss.
- id: N2-aprime-radiative-decay
  process: N2(a')->radiative products
  reason: No radiative transition probability verified in local Guerra Table 5 or
    LoKI-GM scheme.
  blocks: Radiative fate and photon-energy closure for N2(a').
- id: Ar1s5-N2-branching
  process: Ar(1s5)+N2 -> products
  reason: Velazco et al. Table I gives total quenching only, no product branching.
  blocks: Product-resolved Ar metastable transfer; total removal is available.
- id: Ar1s3-N2-branching
  process: Ar(1s3)+N2 -> products
  reason: Velazco et al. Table I gives total quenching only, no product branching.
  blocks: Product-resolved Ar metastable transfer; total removal is available.
- id: sing-sup-state-assignment
  process: N2(X)->N2(sing-sup)
  reason: LoKI-GM treats this as energy-loss-only and no independently matched spectroscopic
    state assignment was established.
  blocks: Resolved product identity and state-specific thermochemistry.
