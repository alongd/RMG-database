  units: m3/s
  source_table: Table 5 N5; primary [199]
- id: N2-aprime-N2-to-B
  reaction: N2(a')+N2(X)->N2(B)+N2(X)
  value: 1.9e-19
  units: m3/s
  source_table: Table 5 N6; primary [200]
- id: N2-B-N2-to-A
  reaction: N2(B)+N2(X)->N2(A)+N2(X)
