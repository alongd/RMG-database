    Sci. Technol. 28 (2019) 073001, Table 5
  unit_note: Guerra Table 5 reports two-body rates in m3 s-1 and radiative transition
    probabilities in s-1.
collisional:
- id: N2-w-N2-to-a
  reaction: N2(w)+N2(X)->N2(a)+N2(X)
