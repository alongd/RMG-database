# NO classes and species references; process keys are LoKI-B solver identities.
species:
  'NO': 'multiplicity 2

    1 N u1 p1 c0 {2,D}

    2 O u0 p2 c0 {1,D}

    '
  N: 'multiplicity 4

    1 N u3 p1 c0

    '
  O-: 'multiplicity 2

    1 O u1 p3 c-1

    '
  NOp: '1 N u0 p1 c0 {2,T}

    2 O u0 p1 c+1 {1,T}

    '
  e-: '1 e u1 p0 c-1

    '
collisions:
  e + NO(X) -> N(4S) + O(-,gnd), Attachment:
    class: A
    reaction: NO + e- => N + O-
  e + NO(X) -> e + NO(X), Effective:
    class: B
  e + NO(X) -> e + NO(V1), Excitation:
    class: B
  e + NO(X) -> e + NO(V2), Excitation:
    class: B
  e + NO(X) -> e + NO(V3), Excitation:
    class: B
  e + NO(X) -> e + NO(V4), Excitation:
    class: B
  e + NO(X) -> e + NO(V5), Excitation:
    class: B
  e + NO(X) -> e + NO(e1), Excitation:
    class: B
  e + NO(X) -> e + NO(e2), Excitation:
    class: B
  e + NO(X) -> e + e + NO(+,gnd), Ionization:
    class: A
    reaction: NO + e- => NOp + e- + e-
